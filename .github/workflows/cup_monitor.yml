name: CUP Monitor Cloud 24/7

on:
  # Pianificazione automatica disattivata (per evitare esecuzioni e notifiche ripetute in background)
  # schedule:
  #   - cron: '*/30 5-21 * * *'
  workflow_dispatch: # Avvio su richiesta manuale con 1 click da smartphone o PC

concurrency:
  group: cup-monitor-cloud
  cancel-in-progress: false

jobs:
  run-monitor:
    name: Verifica Disponibilità CUP
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Configura Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installa Dipendenze & Playwright Chromium
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: 🔄 Ripristina Sessione SPID da Cache GitHub
        uses: actions/cache/restore@v4
        id: session-cache
        with:
          path: session/state.json
          key: cup-session-${{ github.run_id }}
          restore-keys: |
            cup-session-

      - name: ⚙️ Prepara Configurazione & Sessione
        env:
          S_CUP_CONFIG_YAML: ${{ secrets.CUP_CONFIG_YAML }}
          V_CUP_CONFIG_YAML: ${{ vars.CUP_CONFIG_YAML }}
          S_CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
          V_CONFIG_YAML: ${{ vars.CONFIG_YAML }}
          S_CUP_CONFIG: ${{ secrets.CUP_CONFIG }}
          V_CUP_CONFIG: ${{ vars.CUP_CONFIG }}
          S_CUP_SESSION_STATE: ${{ secrets.CUP_SESSION_STATE }}
          V_CUP_SESSION_STATE: ${{ vars.CUP_SESSION_STATE }}
          S_SESSION_STATE: ${{ secrets.SESSION_STATE }}
          V_SESSION_STATE: ${{ vars.SESSION_STATE }}
        run: |
          mkdir -p session logs

          # Cerca il valore della configurazione tra secret e variabili
          CONFIG_CONTENT="${S_CUP_CONFIG_YAML:-${V_CUP_CONFIG_YAML:-${S_CONFIG_YAML:-${V_CONFIG_YAML:-${S_CUP_CONFIG:-$V_CUP_CONFIG}}}}}"
          SESSION_CONTENT="${S_CUP_SESSION_STATE:-${V_CUP_SESSION_STATE:-${S_SESSION_STATE:-$V_SESSION_STATE}}}"

          # 1. Scrittura di config.yaml
          if [ -n "$CONFIG_CONTENT" ]; then
            echo "$CONFIG_CONTENT" > config.yaml
            echo "✅ config.yaml configurato con successo."
          else
            echo "❌ ERRORE CRITICO: Configurazione non trovata!"
            echo "Assicurati di aver aggiunto il secret 'CUP_CONFIG_YAML' in Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

          # 2. Ripristino file session/state.json
          if [ ! -s session/state.json ]; then
            if [ -n "$SESSION_CONTENT" ]; then
              echo "$SESSION_CONTENT" > session/state.json
              echo "✅ File session/state.json inizializzato dal secret iniziale."
            else
              echo "ℹ️ Nessuna sessione presente. Il monitor terminerà in silenzio."
            fi
          else
            echo "✅ Sessione SPID ripristinata con successo dalla cache delle esecuzioni precedenti."
          fi

      - name: 🏥 Esegui Controllo CUP Monitor
        id: run_monitor
        run: |
          set +e
          python src/main.py
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Controllo completato con successo."
            exit 0
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "ℹ️ Sessione non attiva. Monitoraggio completato in silenzio senza inviare notifiche."
            exit 0
          else
            echo "❌ Errore durante l'esecuzione del monitor (codice uscita: $EXIT_CODE)."
            exit $EXIT_CODE
          fi

      - name: 💾 Salva Sessione Aggiornata in Cache per il Prossimo Run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: session/state.json
          key: cup-session-${{ github.run_id }}
